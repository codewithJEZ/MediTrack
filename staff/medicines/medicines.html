<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'staff') window.location.href = '../../index.html';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediTrack | Medicines</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../admin/main.css" />
  <style>
    .status-ok       { background: var(--green-bg);     color: var(--green);       }
    .status-expiring { background: var(--yellow-pale);  color: var(--yellow-dark); }
    .status-low      { background: rgba(234,88,12,.12); color: #c2410c;            }
    .status-expired  { background: rgba(183,28,28,.12); color: #b71c1c;            }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); display: none; }
    .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: .9rem; }

    .btn-add-request {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 8px;
      font-size: .78rem; font-weight: 700;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--maroon), var(--maroon-light));
      color: var(--white);
      border: none;
      box-shadow: 0 2px 8px rgba(123,29,30,.22);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-add-request:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(123,29,30,.32); }
    .btn-add-request:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

    @media (max-width: 480px) {
      .medi-table th:nth-child(4),
      .medi-table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">

    <div class="sidebar-brand">
      <div class="brand-logo-wrap" title="MediTrack">
        <img src="../../assets/logo.png" alt="MediTrack Logo"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
        <span class="brand-logo-icon" style="display:none;"><i class="bi bi-heart-pulse-fill"></i></span>
      </div>
      <div class="brand-text">
        <span class="brand-name">MediTrack</span>
        <span class="brand-tagline">Clinic Inventory</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Main Menu</span>
      <ul>
        <li class="nav-item">
          <a href="../dashboard/index.html" class="nav-link">
            <i class="bi bi-grid-fill nav-icon"></i>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="../medicines/medicines.html" class="nav-link active" aria-current="page">
            <i class="bi bi-capsule-pill nav-icon"></i>
            <span class="nav-label">Medicines</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="../cart/cart.html" class="nav-link">
            <i class="bi bi-cart3 nav-icon"></i>
            <span class="nav-label">Cart</span>
            <span class="nav-badge" id="sidebarCartBadge" style="display:none;">0</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="../ris/ris.html" class="nav-link">
            <i class="bi bi-file-earmark-text-fill nav-icon"></i>
            <span class="nav-label">My Requests</span>
          </a>
        </li>
      </ul>
      <span class="nav-section-label" style="margin-top:8px;">More</span>
      <ul>
        <li class="nav-item">
          <a href="../reports/reports.html" class="nav-link">
            <i class="bi bi-bar-chart-line-fill nav-icon"></i>
            <span class="nav-label">Reports</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="../settings/settings.html" class="nav-link">
            <i class="bi bi-gear-fill nav-icon"></i>
            <span class="nav-label">Settings</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar user-avatar"></div>
        <div class="sidebar-user-info">
          <span class="user-name"></span>
          <span class="user-role"></span>
        </div>
      </div>
      <button class="btn-sidebar-logout logout-btn" type="button">
        <i class="bi bi-box-arrow-right nav-icon"></i>
        <span class="nav-label">Logout</span>
      </button>
    </div>

  </aside>
  <!-- /sidebar -->


  <!-- TOP NAVBAR -->
  <header class="top-navbar" id="topNavbar">
    <div class="navbar-left">
      <button class="btn-menu-toggle" id="menuToggle" aria-label="Toggle Sidebar">
        <i class="bi bi-list"></i>
      </button>
      <div class="navbar-page-info">
        <div class="page-title">Medicines</div>
        <div class="page-crumb">
          <i class="bi bi-house-fill" style="font-size:.68rem;"></i>
          &nbsp;Home &rsaquo; Medicines
        </div>
      </div>
    </div>
    <div class="navbar-right">
      <div class="navbar-user" tabindex="0">
        <div class="user-avatar-nav user-avatar"></div>
        <div class="user-text">
          <span class="user-name-nav user-name"></span>
          <span class="user-role-nav user-role"></span>
        </div>
        <i class="bi bi-chevron-down" style="font-size:.72rem;color:var(--text-3);margin-left:4px;"></i>
      </div>
    </div>
  </header>
  <!-- /top-navbar -->


  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">

    <!-- Toolbar -->
    <div class="page-toolbar au d1">
      <div class="toolbar-left">
        <div class="page-search">
          <i class="bi bi-search"></i>
          <input type="search" id="searchInput" placeholder="Search by name or category…" />
        </div>
        <select class="filter-select" id="categoryFilter">
          <option value="">All Categories</option>
        </select>
        <select class="filter-select" id="statusFilter">
          <option value="">All Status</option>
          <option value="OK">OK</option>
          <option value="Expiring Soon">Expiring Soon</option>
          <option value="Low Stock">Low Stock</option>
          <option value="Expired">Expired</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="btn-secondary-mt" id="btnViewCart" onclick="window.location.href='../cart/cart.html'"
                style="position:relative;">
          <i class="bi bi-cart3"></i> View Cart
          <span id="cartBadge"
                style="display:none;position:absolute;top:-7px;right:-7px;background:var(--maroon);color:#fff;border-radius:50%;min-width:20px;height:20px;font-size:.68rem;font-weight:800;align-items:center;justify-content:center;padding:0 3px;">
            0
          </span>
        </button>
      </div>
    </div>

    <!-- Table Card -->
    <div class="card-panel au d2">
      <div class="tbl-header" style="margin-bottom:18px;">
        <h3><i class="bi bi-capsule-pill" style="color:var(--maroon);margin-right:8px;"></i>Medicine Inventory</h3>
        <span id="medicineCount" style="font-size:.8rem;color:var(--text-3);font-weight:600;"></span>
      </div>
      <div class="table-responsive">
        <table class="medi-table" id="medicinesTable" aria-label="Medicine Inventory Table">
          <thead>
            <tr>
              <th>Medicine</th>
              <th>Category</th>
              <th>Qty</th>
              <th>Unit</th>
              <th>Expiration</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="medicinesBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState">
          <i class="bi bi-capsule-pill"></i>
          <p>No medicines found matching your search.</p>
        </div>
      </div>
    </div>

  </main>
  <!-- /main-content -->

</div>
<!-- /app wrapper -->


<div class="toast-stack" id="toastStack"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="../../js/global.js"></script>
<script src="medicines.js"></script>
</body>
</html>
